<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LockedIn</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #0066CC 0%, #00cc99 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <main class="w-100">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                    <div class="card shadow-lg border-0">
                        <!-- Card Header -->
                        <div class="card-header bg-primary text-white text-center py-4">
                            <i class="bi bi-safe2 display-4"></i>
                            <h1 class="h3 mt-2 mb-0">LockedIn</h1>
                            <p class="small mb-0">Sistema de Empréstimos</p>
                        </div>

                        <!-- Card Body -->
                        <div class="card-body p-4">
                            <form id="loginForm" onsubmit="handleLogin(event)">
                                <!-- Email Input -->
                                <div class="mb-3">
                                    <label for="email" class="form-label fw-bold">
                                        <i class="bi bi-envelope"></i> Email
                                    </label>
                                    <input 
                                        type="email" 
                                        class="form-control form-control-lg" 
                                        id="email" 
                                        name="email"
                                        placeholder="seu@email.com"
                                        required
                                    >
                                </div>

                                <!-- Password Input -->
                                <div class="mb-3">
                                    <label for="password" class="form-label fw-bold">
                                        <i class="bi bi-lock"></i> Senha
                                    </label>
                                    <input 
                                        type="password" 
                                        class="form-control form-control-lg" 
                                        id="password" 
                                        name="password"
                                        placeholder="••••••••"
                                        required
                                    >
                                </div>

                                <!-- Remember Me -->
                                <div class="form-check mb-3">
                                    <input 
                                        class="form-check-input" 
                                        type="checkbox" 
                                        id="rememberMe"
                                        name="rememberMe"
                                    >
                                    <label class="form-check-label" for="rememberMe">
                                        Lembrar de mim
                                    </label>
                                </div>

                                <!-- Alert Messages -->
                                <div id="alertMessage" class="alert alert-danger d-none" role="alert"></div>

                                <!-- Submit Button -->
                                <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold mb-3">
                                    <i class="bi bi-box-arrow-in-right"></i> Entrar
                                </button>
                            </form>

                            <!-- Divider -->
                            <div class="d-flex align-items-center my-4">
                                <hr class="flex-grow-1">
                                <span class="mx-2 text-muted small">ou</span>
                                <hr class="flex-grow-1">
                            </div>

                            <!-- Help Links -->
                            <div class="text-center">
                                <p class="small mb-2">
                                    <a href="#" class="text-decoration-none">Esqueceu sua senha?</a>
                                </p>
                                <p class="small text-muted">
                                    Entre em contato com o administrador para acessar o sistema
                                </p>
                            </div>
                        </div>

                        <!-- Card Footer -->
                        <div class="card-footer bg-light text-center py-3">
                            <small class="text-muted">
                                LockedIn &copy; 2026 • Todos os direitos reservados
                            </small>
                        </div>
                    </div>

                    <!-- Info Box -->
                    <div class="alert alert-info mt-4" role="alert">
                        <i class="bi bi-info-circle"></i>
                        <strong> Dados de Teste:</strong>
                        <br>
                        <small>
                            Email: <code>admin@test.com</code>
                            <br>
                            Senha: <code>123456</code>
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alertDiv = document.getElementById('alertMessage');
            
            // Mock login - replace with actual API call
            if (email && password) {
                localStorage.setItem('token', 'mock_token_' + Date.now());
                localStorage.setItem('userEmail', email);
                window.location.href = 'pages/dashboard.html';
            } else {
                alertDiv.textContent = 'Por favor, preencha todos os campos.';
                alertDiv.classList.remove('d-none');
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('userEmail');
            window.location.href = '../login.html';
        }
    </script>
</body>
</html>
