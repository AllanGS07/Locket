<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Ativos - LockedIn</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <!-- Header -->
    <header class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="../index.html">
                <i class="bi bi-safe2"></i> LockedIn
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <nav class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="usuarios.html"><i class="bi bi-people"></i> Usuários</a></li>
                    <li class="nav-item"><a class="nav-link" href="empresarios.html"><i class="bi bi-briefcase"></i> Empresários</a></li>
                    <li class="nav-item"><a class="nav-link active" href="ativos.html"><i class="bi bi-box"></i> Ativos</a></li>
                    <li class="nav-item"><a class="nav-link" href="auditoria.html"><i class="bi bi-shield-check"></i> Auditoria</a></li>
                    <li class="nav-item"><a class="nav-link" href="relatorios.html"><i class="bi bi-file-earmark-text"></i> Relatórios</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle"></i> Perfil
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="perfil.html">Meu Perfil</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="logout()">Sair</a></li>
                        </ul>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow-1 py-4">
        <div class="container-fluid">
            <!-- Page Header -->
            <section class="mb-5">
                <div class="row align-items-center">
                    <div class="col">
                        <h1 class="h2 fw-bold mb-0">
                            <i class="bi bi-box"></i> Gerenciar Ativos
                        </h1>
                        <p class="text-muted">Cadastro de bens e ativos colateralizados</p>
                    </div>
                    <div class="col-auto">
                        <a href="ativos-form.html" class="btn btn-primary">
                            <i class="bi bi-plus-circle"></i> Novo Ativo
                        </a>
                    </div>
                </div>
            </section>

            <!-- Filters -->
            <section class="row mb-4">
                <aside class="col-12">
                    <div class="card border-0 shadow-sm">
                        <div class="card-body">
                            <div class="row g-3">
                                <div class="col-12 col-md-5">
                                    <input 
                                        type="text" 
                                        class="form-control" 
                                        placeholder="Buscar por descrição ou serial..."
                                        onkeyup="loadAssets()"
                                    >
                                </div>
                                <div class="col-12 col-md-4">
                                    <select class="form-select" id="typeFilter" onchange="loadAssets()">
                                        <option value="">Todos os tipos</option>
                                        <option value="imovel">Imóvel</option>
                                        <option value="veiculo">Veículo</option>
                                        <option value="equipamento">Equipamento</option>
                                        <option value="outro">Outro</option>
                                    </select>
                                </div>
                                <div class="col-12 col-md-3">
                                    <button class="btn btn-outline-secondary w-100" onclick="loadAssets()">
                                        <i class="bi bi-arrow-clockwise"></i> Atualizar
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </aside>
            </section>

            <!-- Assets Grid -->
            <section class="row g-4" id="assetsGrid">
                <div class="col-12 text-center text-muted py-4">
                    <i class="bi bi-hourglass-split"></i> Carregando ativos...
                </div>
            </section>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-light py-4 mt-5">
        <div class="container-fluid">
            <p class="text-muted small mb-0">&copy; 2026 LockedIn. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            checkAuth();
            loadAssets();
        });

        async function loadAssets() {
            const grid = document.getElementById('assetsGrid');
            grid.innerHTML = '<div class="col-12 text-center text-muted py-4"><i class="bi bi-hourglass-split"></i> Carregando ativos da API...</div>';

            try {
                const response = await assetsAPI.getAll();
                const itens = Array.isArray(response?.data) ? response.data : Array.isArray(response) ? response : [];

                grid.innerHTML = '';
                if (!itens.length) {
                    grid.innerHTML = '<div class="col-12 text-center text-muted py-4">Nenhum ativo encontrado na API.</div>';
                    return;
                }

                grid.innerHTML = itens.map(asset => `
                    <article class="col-12 col-md-6 col-lg-4">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-start mb-3">
                                    <h6 class="card-title fw-bold">${asset.Nome || asset.nome || asset.description || 'Ativo'}</h6>
                                    <span class="badge bg-info">${asset.Status_Item || asset.status_item || asset.status || 'Disponível'}</span>
                                </div>
                                <p class="text-muted small mb-2"><i class="bi bi-hash"></i> Tombamento: ${asset.Numero_Tombamento || asset.numero_tombamento || '-'}</p>
                                <p class="text-muted small mb-2"><i class="bi bi-tag"></i> Marca/Modelo: ${asset.Marca || asset.marca || '-'} / ${asset.Modelo || asset.modelo || '-'}</p>
                                <p class="text-muted small mb-3"><i class="bi bi-briefcase"></i> Instituição: ${asset.ID_Instituicao || asset.id_instituicao || '-'}</p>
                                <div class="d-flex gap-2">
                                    <a href="ativos-form.html?id=${asset.ID_Objeto || asset.id}" class="btn btn-sm btn-outline-primary flex-grow-1"><i class="bi bi-pencil"></i> Editar</a>
                                    <button class="btn btn-sm btn-outline-danger" onclick="deleteAsset(${asset.ID_Objeto || asset.id})"><i class="bi bi-trash"></i></button>
                                </div>
                            </div>
                        </div>
                    </article>
                `).join('');
            } catch (error) {
                console.error('Erro ao carregar ativos:', error);
                grid.innerHTML = '<div class="col-12 text-center text-danger py-4">Erro ao carregar ativos do servidor.</div>';
            }
        }

        async function deleteAsset(id) {
            if (!confirm('Tem certeza que deseja deletar este ativo?')) return;

            try {
                await assetsAPI.delete(id);
                showToast('Ativo deletado com sucesso!', 'success');
                await loadAssets();
            } catch (error) {
                console.error('Erro ao deletar ativo:', error);
                showToast('Erro ao deletar ativo.', 'danger');
            }
        }
    </script>
</body>
</html>
